services:
  - type: web
    name: deep-trace-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SEED_DATABASE
        value: "true"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://nikhil1120.github.io"
      # Set manually in Render dashboard (Neon connection string):
      # - key: DATABASE_URL
